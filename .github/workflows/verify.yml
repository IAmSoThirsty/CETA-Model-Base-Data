name: Verify reference package

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.3"
          enable-cache: true
      - name: Install the locked governed verification environment
        run: uv sync --locked --extra training --extra language-adapter --group ci
      - name: Verify dependencies, architecture, and package
        run: |
          uv run --no-sync python -m pip_audit --local --progress-spinner off
          uv run --no-sync ruff check --select F,E9 src scripts tests examples
          uv run --no-sync python scripts/verify_all.py
          uv run --no-sync python scripts/verify_package.py
