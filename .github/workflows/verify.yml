name: Verify reference package

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install governed language-adapter dependencies and audit tools
        run: python -m pip install --requirement requirements-language-adapter.txt pip-audit==2.10.1 ruff==0.16.4
      - name: Verify dependencies, architecture, and package
        run: |
          python -m pip_audit --local --progress-spinner off
          ruff check --select F,E9 src scripts tests examples
          python scripts/verify_all.py
          python scripts/verify_package.py
